<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDesign Studio - Dashboard</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Twoja paleta (zgodna z ciemnym motywem projektu) */
            --pd-bg: #121212;
            --pd-zinc-950: #121212;
            --pd-zinc-900: #1e1e1e;
            --pd-zinc-800: #2a2a2a;
            --pd-zinc-700: #3c3c3c;
            --pd-zinc-600: #858585;
            --pd-zinc-500: #858585;
            --pd-zinc-400: #bdbdbd;
            --pd-zinc-300: #d0d0d0;
            --pd-zinc-200: #e0e0e0;
            --pd-zinc-100: #f5f5f5;
            --pd-indigo-500: #f36c00;
            --pd-indigo-600: #f36c00;
            --pd-emerald-500: #28a745;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            border-radius: 0 !important;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--pd-bg);
            color: var(--pd-zinc-400);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* Lucide icon sizes */
        .icon-12 {
            width: 12px;
            height: 12px;
        }

        .icon-14 {
            width: 14px;
            height: 14px;
        }

        .icon-16 {
            width: 16px;
            height: 16px;
        }

        .icon-20 {
            width: 20px;
            height: 20px;
        }

        .icon-24 {
            width: 24px;
            height: 24px;
        }

        .pd-app {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        .pd-sidebar {
            width: 72px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem 0;
            border-right: 1px solid var(--pd-zinc-800);
            background: var(--pd-zinc-950);
            z-index: 20;
        }

        .pd-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--pd-indigo-600);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(49, 46, 129, 0.35);
        }

        .pd-nav {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            flex: 1;
            width: 100%;
            align-items: center;
            padding: 0 0.5rem;
        }

        .pd-nav-btn {
            position: relative;
            display: flex;
            width: 48px;
            height: 48px;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--pd-zinc-500);
            cursor: pointer;
            transition: background 0.15s, color 0.15s, box-shadow 0.15s;
        }

        .pd-nav-btn:hover {
            background: var(--pd-zinc-900);
            color: var(--pd-zinc-100);
        }

        .pd-nav-btn--active {
            background: var(--pd-zinc-800);
            color: var(--pd-zinc-100);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.45), 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .pd-sidebar-footer {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: auto;
        }

        .pd-sep {
            width: 32px;
            height: 1px;
            background: var(--pd-zinc-800);
            margin: 0.5rem 0;
        }

        .pd-avatar {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--pd-zinc-800);
            box-shadow: 0 0 0 1px rgba(39, 39, 42, 0.5);
        }

        .pd-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pd-main-col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .pd-header {
            z-index: 10;
            flex-shrink: 0;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0 1rem;
            border-bottom: 1px solid var(--pd-zinc-800);
            background: var(--pd-zinc-950);
        }

        .pd-header-left {
            display: flex;
            min-width: 0;
            flex: 1;
            align-items: center;
            gap: 0.75rem;
        }

        .pd-breadcrumb {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            gap: 0.5rem;
            color: var(--pd-zinc-500);
        }

        .pd-breadcrumb-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--pd-zinc-400);
        }

        .pd-breadcrumb-current {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--pd-zinc-200);
            max-width: 12rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pd-search-wrap {
            position: relative;
            display: none;
            min-width: 0;
            flex: 1;
            max-width: 36rem;
            margin-left: 0.5rem;
        }

        @media (min-width: 768px) {
            .pd-search-wrap {
                display: block;
            }
        }

        .pd-search-wrap .icon-16 {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--pd-zinc-600);
            pointer-events: none;
        }

        .pd-search-input {
            width: 100%;
            border-radius: 6px;
            border: 1px solid var(--pd-zinc-800);
            background: var(--pd-zinc-900);
            padding: 0.375rem 1rem 0.375rem 2.5rem;
            font-size: 0.875rem;
            color: var(--pd-zinc-300);
        }

        .pd-search-input::placeholder {
            color: var(--pd-zinc-600);
        }

        .pd-search-input:focus {
            outline: none;
            border-color: var(--pd-indigo-500);
            box-shadow: 0 0 0 1px var(--pd-indigo-500);
        }

        .pd-header-right {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .pd-segment {
            display: none;
            align-items: center;
            border-radius: 6px;
            border: 1px solid var(--pd-zinc-800);
            background: var(--pd-zinc-900);
            padding: 4px;
        }

        @media (min-width: 640px) {
            .pd-segment {
                display: flex;
            }
        }

        .pd-segment-btn {
            border: none;
            background: transparent;
            border-radius: 4px;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--pd-zinc-500);
        }

        .pd-segment-btn--on {
            background: var(--pd-zinc-800);
            color: var(--pd-zinc-100);
        }

        .pd-url-group {
            display: flex;
            min-width: 0;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--pd-zinc-800);
            background: var(--pd-zinc-900);
        }

        .pd-url-group .icon-16 {
            flex-shrink: 0;
            color: var(--pd-zinc-600);
        }

        #addressBar {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            font-size: 0.75rem;
            color: var(--pd-zinc-200);
        }

        #addressBar::placeholder {
            color: var(--pd-zinc-600);
        }

        #addressBar:focus {
            outline: none;
        }

        .pd-btn {
            border-radius: 6px;
            border: 1px solid var(--pd-zinc-800);
            background: var(--pd-zinc-900);
            padding: 0.375rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--pd-zinc-200);
            cursor: pointer;
            transition: background 0.15s;
        }

        .pd-btn:hover {
            background: var(--pd-zinc-800);
        }

        .pd-btn--primary {
            border-color: transparent;
            background: var(--pd-indigo-600);
            color: #fff;
        }

        .pd-btn--primary:hover {
            background: #4f46e5;
        }

        .pd-icon-btn {
            padding: 0.5rem;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--pd-zinc-500);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .pd-icon-btn:hover {
            background: var(--pd-zinc-900);
            color: var(--pd-zinc-100);
        }

        .pd-publish {
            margin-left: 0.25rem;
            border: none;
            border-radius: 6px;
            background: var(--pd-indigo-600);
            color: #fff;
            padding: 0.375rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
        }

        .pd-publish:hover {
            background: #4f46e5;
        }

        .pd-canvas-wrap {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 1rem;
        }

        @media (min-width: 768px) {
            .pd-canvas-wrap {
                padding: 1.5rem;
            }
        }

        .grid-bg {
            background-image: radial-gradient(#27272a 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .pd-viewport-card {
            display: flex;
            min-height: 0;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid var(--pd-zinc-800);
            background: rgba(24, 24, 27, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .pd-viewport-chrome {
            flex-shrink: 0;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            border-bottom: 1px solid var(--pd-zinc-800);
            background: rgba(24, 24, 27, 0.8);
        }

        .pd-dots {
            display: flex;
            gap: 6px;
        }

        .pd-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--pd-zinc-700);
        }

        .pd-viewport-title {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--pd-zinc-600);
        }

        .iframe-stage {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            background: rgba(9, 9, 11, 0.5);
        }

        .iframe-stage iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            opacity: 0;
            background: transparent;
            transition: opacity 0.2s ease;
        }

        .iframe-stage iframe.active {
            display: block;
            opacity: 1;
        }

        .pd-float-tools {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--pd-zinc-800);
            background: var(--pd-zinc-900);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
        }

        .pd-float-tools button {
            padding: 0.5rem;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: var(--pd-zinc-400);
            cursor: pointer;
        }

        .pd-float-tools button:hover {
            background: var(--pd-zinc-800);
        }

        .pd-float-tools hr {
            margin: 0;
            border: none;
            height: 1px;
            background: var(--pd-zinc-800);
        }

        .pd-footer {
            flex-shrink: 0;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            border-top: 1px solid var(--pd-zinc-800);
            background: var(--pd-zinc-950);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--pd-zinc-500);
        }

        .pd-footer-left,
        .pd-footer-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .pd-footer-right {
            gap: 1.5rem;
        }

        .pd-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--pd-emerald-500);
            animation: pd-pulse 2s ease-in-out infinite;
        }

        @keyframes pd-pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .pd-footer-link {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .pd-footer-link:hover {
            color: var(--pd-zinc-300);
        }

        html {
            scrollbar-gutter: stable;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.65);
            padding: 1rem;
            box-sizing: border-box;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .pd-modal {
            width: 100%;
            max-width: 32rem;
            max-height: min(85vh, calc(100vh - 2rem));
            margin: auto;
            flex-shrink: 0;
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-gutter: stable;
            border-radius: 12px;
            border: 1px solid var(--pd-zinc-800);
            background: var(--pd-zinc-900);
            padding: 1.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .pd-modal h3 {
            margin: 0 0 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--pd-zinc-100);
        }

        .pd-modal-fields {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .pd-field label {
            display: block;
            margin-bottom: 4px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--pd-zinc-500);
        }

        .pd-field-row {
            display: flex;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid var(--pd-zinc-800);
            background: var(--pd-zinc-950);
        }

        .pd-field-prefix,
        .pd-field-suffix {
            flex-shrink: 0;
            width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--pd-zinc-900);
            color: var(--pd-zinc-500);
            border-right: 1px solid var(--pd-zinc-800);
        }

        .pd-field-suffix {
            border-right: none;
            border-left: 1px solid var(--pd-zinc-800);
        }

        .pd-field-row input {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            padding: 0.5rem 0.75rem;
            font-size: 0.75rem;
            color: var(--pd-zinc-200);
        }

        .pd-field-row input::placeholder {
            color: var(--pd-zinc-600);
        }

        .pd-field-row input:focus {
            outline: none;
        }

        .pd-modal-actions {
            margin-top: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .ripple {
            position: absolute;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
            border-radius: 9999px;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .custom-tooltip {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid #3f3f46 !important;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border-radius: 6px;
        }

        .nav-favicon {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .nav-favicon-fallback {
            width: 22px;
            height: 22px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fafafa;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            background: #18181b;
        }

        .bookmark-favicon {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .bookmark-favicon-fallback {
            width: 18px;
            height: 18px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fafafa;
            background: #18181b;
            border: 1px solid #3f3f46;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div id="app" class="pd-app">

        <aside id="sidebar" class="pd-sidebar">
            <div class="pd-logo">
                <i data-lucide="command" class="icon-24"></i>
            </div>

            <nav class="pd-nav">
                <button type="button" class="time-control pd-nav-btn" data-title="Home" data-iframe-target="iframe1"
                    onclick="window.switchIframe('iframe1')">
                    <img class="nav-favicon" data-favicon-for="navIframe1" alt="" />
                    <span class="nav-favicon-fallback bookmark-favicon-fallback" data-fallback-for="navIframe1">H</span>
                </button>
                <button type="button" class="time-control pd-nav-btn" data-title="Play" data-iframe-target="iframe2"
                    onclick="window.switchIframe('iframe2')">
                    <img class="nav-favicon" data-favicon-for="navIframe2" alt="" />
                    <span class="nav-favicon-fallback bookmark-favicon-fallback" data-fallback-for="navIframe2">P</span>
                </button>
                <button type="button" class="time-control pd-nav-btn" data-title="Settings" data-iframe-target="iframe3"
                    onclick="window.switchIframe('iframe3')">
                    <img class="nav-favicon" data-favicon-for="navIframe3" alt="" />
                    <span class="nav-favicon-fallback bookmark-favicon-fallback" data-fallback-for="navIframe3">S</span>
                </button>
                <button type="button" class="time-control pd-nav-btn" data-title="Menu" data-iframe-target="iframe4"
                    onclick="window.switchIframe('iframe4')">
                    <img class="nav-favicon" data-favicon-for="navIframe4" alt="" />
                    <span class="nav-favicon-fallback bookmark-favicon-fallback" data-fallback-for="navIframe4">M</span>
                </button>

                <div class="pd-sep"></div>

                <button type="button" class="time-control pd-nav-btn" id="openUrlModal" data-title="Links">
                    <i data-lucide="link-2" class="icon-20"></i>
                </button>
            </nav>

            <div class="pd-sidebar-footer">
                <button type="button" class="time-control pd-nav-btn" id="themeToggle" data-title="Theme">
                    <i data-lucide="moon" class="icon-20" id="themeIconLucide"></i>
                </button>
                <div class="pd-avatar">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&h=80&q=80"
                        alt="Profile">
                </div>
            </div>
        </aside>

        <div class="pd-main-col">

            <header class="pd-header">
                <div class="pd-header-left">
                    <div class="pd-breadcrumb">
                        <i data-lucide="folder" class="icon-16"></i>
                        <span class="pd-breadcrumb-label">Projects</span>
                        <i data-lucide="chevron-right" class="icon-12"></i>
                        <span id="breadcrumbProjectName" class="pd-breadcrumb-current">Home</span>
                    </div>
                    <div class="pd-search-wrap">
                        <i data-lucide="search" class="icon-16"></i>
                        <input type="text" class="pd-search-input" placeholder="Search components, assets, or layers…">
                    </div>
                </div>

                <div class="pd-header-right">
                    <div class="pd-segment">
                        <button type="button" class="pd-segment-btn pd-segment-btn--on">Design</button>
                        <button type="button" class="pd-segment-btn">Prototype</button>
                    </div>
                    <div class="pd-url-group">
                        <i data-lucide="globe" class="icon-16"></i>
                        <input id="addressBar" type="url" placeholder="URL aktywnego projektu…">
                    </div>
                    <button type="button" id="openAddressBtn" class="pd-btn">Otwórz</button>
                    <button type="button" id="saveAddressBtn" class="pd-btn pd-btn--primary">Zapisz</button>
                    <button type="button" class="pd-icon-btn" aria-label="Share"><i data-lucide="share-2"
                            class="icon-16"></i></button>
                    <button type="button" class="pd-icon-btn" aria-label="Play"><i data-lucide="play"
                            class="icon-16"></i></button>
                    <button type="button" class="pd-publish">Publish</button>
                </div>
            </header>

            <main class="pd-canvas-wrap grid-bg">
                <div class="pd-viewport-card">
                    <div class="pd-viewport-chrome">
                        <div class="pd-dots">
                            <span class="pd-dot"></span><span class="pd-dot"></span><span class="pd-dot"></span>
                        </div>
                        <div class="pd-viewport-title">Main Viewport</div>
                        <div style="width:32px"></div>
                    </div>
                    <div class="iframe-stage">
                        <iframe id="iframe1" src="https://s-pro-v.github.io/css-up/" title="Home View"></iframe>
                        <iframe id="iframe2" src="https://s-pro-v.github.io/css_injector/" title="Games View"></iframe>
                        <iframe id="iframe3" src="https://edytor.carrd.co/" title="Settings View"></iframe>
                        <iframe id="iframe4" src="https://glassplay.carrd.co/" title="Menu View"></iframe>
                    </div>
                </div>

                <div class="pd-float-tools">
                    <button type="button"><i data-lucide="zoom-in" class="icon-16"></i></button>
                    <button type="button"><i data-lucide="zoom-out" class="icon-16"></i></button>
                    <hr>
                    <button type="button"><i data-lucide="maximize" class="icon-16"></i></button>
                </div>
            </main>

            <footer class="pd-footer">
                <div class="pd-footer-left">
                    <div style="display:flex;align-items:center;gap:6px">
                        <span class="pd-status-dot"></span>
                        <span>Connected</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:4px">
                        <i data-lucide="database" class="icon-12"></i>
                        <span>Sync Active</span>
                    </div>
                </div>
                <div class="pd-footer-right">
                    <div style="display:flex;gap:8px">
                        <span>X: 1024</span>
                        <span>Y: 768</span>
                    </div>
                    <div class="pd-footer-link">
                        <span>100%</span>
                        <i data-lucide="chevron-up" class="icon-12"></i>
                    </div>
                    <div class="pd-footer-link">
                        <i data-lucide="help-circle" class="icon-12"></i>
                        <span>Support</span>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <div class="modal-overlay" id="urlModalOverlay" aria-hidden="true">
        <div class="pd-modal" role="dialog" aria-modal="true" aria-labelledby="urlModalTitle">
            <h3 id="urlModalTitle">Adresy projektów (iframe)</h3>
            <div class="pd-modal-fields">
                <div class="pd-field">
                    <label for="urlIframe1">Home</label>
                    <div class="pd-field-row">
                        <span class="pd-field-prefix"><i data-lucide="home" class="icon-16"></i></span>
                        <input id="urlIframe1" type="url" placeholder="https://…">
                        <span class="pd-field-suffix">
                            <img class="bookmark-favicon" data-favicon-for="urlIframe1" alt="">
                            <span class="bookmark-favicon-fallback" data-fallback-for="urlIframe1">H</span>
                        </span>
                    </div>
                </div>
                <div class="pd-field">
                    <label for="urlIframe2">Play</label>
                    <div class="pd-field-row">
                        <span class="pd-field-prefix"><i data-lucide="gamepad-2" class="icon-16"></i></span>
                        <input id="urlIframe2" type="url" placeholder="https://…">
                        <span class="pd-field-suffix">
                            <img class="bookmark-favicon" data-favicon-for="urlIframe2" alt="">
                            <span class="bookmark-favicon-fallback" data-fallback-for="urlIframe2">P</span>
                        </span>
                    </div>
                </div>
                <div class="pd-field">
                    <label for="urlIframe3">Settings</label>
                    <div class="pd-field-row">
                        <span class="pd-field-prefix"><i data-lucide="code" class="icon-16"></i></span>
                        <input id="urlIframe3" type="url" placeholder="https://…">
                        <span class="pd-field-suffix">
                            <img class="bookmark-favicon" data-favicon-for="urlIframe3" alt="">
                            <span class="bookmark-favicon-fallback" data-fallback-for="urlIframe3">S</span>
                        </span>
                    </div>
                </div>
                <div class="pd-field">
                    <label for="urlIframe4">Menu</label>
                    <div class="pd-field-row">
                        <span class="pd-field-prefix"><i data-lucide="video" class="icon-16"></i></span>
                        <input id="urlIframe4" type="url" placeholder="https://…">
                        <span class="pd-field-suffix">
                            <img class="bookmark-favicon" data-favicon-for="urlIframe4" alt="">
                            <span class="bookmark-favicon-fallback" data-fallback-for="urlIframe4">M</span>
                        </span>
                    </div>
                </div>
                <div class="pd-field">
                    <label for="githubConfigUrl">JSON z GitHub (raw)</label>
                    <div class="pd-field-row">
                        <span class="pd-field-prefix"><i data-lucide="github" class="icon-16"></i></span>
                        <input id="githubConfigUrl" type="url"
                            placeholder="https://raw.githubusercontent.com/…/urls.json">
                    </div>
                </div>
            </div>
            <div class="pd-modal-actions">
                <button type="button" id="cancelUrlModal" class="pd-btn">Zamknij</button>
                <button type="button" id="loadGithubUrls" class="pd-btn">Wczytaj z GitHuba</button>
                <button type="button" id="saveUrlConfig" class="pd-btn pd-btn--primary">Zapisz</button>
            </div>
        </div>
    </div>

    <script>
        const IFRAME_IDS = ['iframe1', 'iframe2', 'iframe3', 'iframe4'];
        const URL_STORAGE_KEY = 'hud-iframe-urls';

        const state = {
            activeIframe: null,
            defaultUrls: {
                iframe1: 'https://s-pro-v.github.io/css-up/',
                iframe2: 'https://s-pro-v.github.io/css_injector/',
                iframe3: 'https://edytor.carrd.co/',
                iframe4: 'https://glassplay.carrd.co/'
            },
            colorMap: {
                'Home': { ripple: 'rgba(99, 102, 241, 0.45)' },
                'Play': { ripple: 'rgba(34, 197, 94, 0.45)' },
                'Settings': { ripple: 'rgba(56, 189, 248, 0.45)' },
                'Menu': { ripple: 'rgba(244, 63, 94, 0.45)' }
            }
        };

        function refreshLucide() {
            if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('hud-theme', theme);
            const holder = document.getElementById('themeToggle');
            if (!holder) return;
            const name = theme === 'dark' ? 'moon' : 'sun';
            holder.innerHTML = `<i data-lucide="${name}" class="icon-20" id="themeIconLucide"></i>`;
            refreshLucide();
        }

        function setupThemeToggle() {
            const saved = localStorage.getItem('hud-theme');
            applyTheme(saved || 'dark');
            const btn = document.getElementById('themeToggle');
            if (!btn) return;
            btn.addEventListener('click', () => {
                const cur = localStorage.getItem('hud-theme') === 'light' ? 'light' : 'dark';
                applyTheme(cur === 'dark' ? 'light' : 'dark');
            });
        }

        function getCleanDomain(url) {
            return String(url || '')
                .trim()
                .replace(/^https?:\/\//, '')
                .replace(/^www\./, '')
                .split('/')[0];
        }

        function getFaviconUrl(url) {
            const cleanUrl = getCleanDomain(url);
            if (!cleanUrl) return '';
            if (cleanUrl.includes('carrd.co')) {
                return `https://${cleanUrl}/assets/images/favicon.png`;
            }
            return `https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://${cleanUrl}&size=32`;
        }

        function showFaviconFallback(imgElement, rawUrl) {
            if (!imgElement) return;
            imgElement.style.display = 'none';
            const fallbackEl = document.querySelector(`[data-fallback-for="${imgElement.dataset.faviconFor}"]`);
            if (fallbackEl) {
                fallbackEl.textContent = getFirstLetter(rawUrl);
                fallbackEl.style.display = 'flex';
            }
        }

        function handleFaviconError(imgElement, rawUrl) {
            const attempt = parseInt(imgElement.dataset.attempt || '1', 10);
            const cleanUrl = getCleanDomain(rawUrl);
            const isCarrd = cleanUrl.includes('carrd.co');
            if (!cleanUrl) {
                showFaviconFallback(imgElement, rawUrl);
                return;
            }
            if (isCarrd) {
                if (attempt === 1) {
                    imgElement.src = `https://${cleanUrl}/assets/images/apple-touch-icon.png`;
                    imgElement.dataset.attempt = '2';
                } else if (attempt === 2) {
                    imgElement.src = `https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://${cleanUrl}&size=32`;
                    imgElement.dataset.attempt = '3';
                } else if (attempt === 3) {
                    imgElement.src = `https://favicon.yandex.net/favicon/${cleanUrl}`;
                    imgElement.dataset.attempt = '4';
                } else {
                    showFaviconFallback(imgElement, rawUrl);
                }
            } else if (attempt === 1) {
                imgElement.src = `https://www.google.com/s2/favicons?domain=${cleanUrl}&sz=32`;
                imgElement.dataset.attempt = '2';
            } else if (attempt === 2) {
                imgElement.src = `https://icons.duckduckgo.com/ip3/${cleanUrl}.ico`;
                imgElement.dataset.attempt = '3';
            } else if (attempt === 3) {
                imgElement.src = `https://${cleanUrl}/favicon.ico`;
                imgElement.dataset.attempt = '4';
            } else {
                showFaviconFallback(imgElement, rawUrl);
            }
        }

        function getFirstLetter(url) {
            try {
                const domain = getCleanDomain(url);
                return domain ? domain.charAt(0).toUpperCase() : '?';
            } catch (e) {
                return '?';
            }
        }

        function updateFaviconForInput(inputId, value) {
            const img = document.querySelector(`[data-favicon-for="${inputId}"]`);
            const fallbackEl = document.querySelector(`[data-fallback-for="${inputId}"]`);
            if (!img || !fallbackEl) return;
            if (!value || !String(value).trim()) {
                img.style.display = 'none';
                fallbackEl.textContent = getFirstLetter('');
                fallbackEl.style.display = 'flex';
                return;
            }
            img.dataset.attempt = '1';
            img.style.display = 'block';
            fallbackEl.style.display = 'none';
            img.onerror = () => handleFaviconError(img, value);
            img.onload = () => {
                img.style.display = 'block';
                fallbackEl.style.display = 'none';
            };
            img.src = getFaviconUrl(value);
        }

        function updateNavFaviconForIframe(iframeId, value) {
            const slotId = `nav${iframeId.charAt(0).toUpperCase()}${iframeId.slice(1)}`;
            const img = document.querySelector(`[data-favicon-for="${slotId}"]`);
            const fallbackEl = document.querySelector(`[data-fallback-for="${slotId}"]`);
            if (!img || !fallbackEl) return;
            if (!value || !String(value).trim()) {
                img.style.display = 'none';
                fallbackEl.textContent = getFirstLetter('');
                fallbackEl.style.display = 'flex';
                return;
            }
            img.dataset.attempt = '1';
            img.style.display = 'block';
            fallbackEl.style.display = 'none';
            img.onerror = () => handleFaviconError(img, value);
            img.onload = () => {
                img.style.display = 'block';
                fallbackEl.style.display = 'none';
            };
            img.src = getFaviconUrl(value);
        }

        function refreshNavFavicons(urlConfig) {
            IFRAME_IDS.forEach(id => {
                const src = (urlConfig[id] || state.defaultUrls[id] || '').trim();
                updateNavFaviconForIframe(id, src);
            });
        }

        function refreshAllModalFavicons() {
            IFRAME_IDS.forEach(id => {
                const inputId = `url${id.charAt(0).toUpperCase()}${id.slice(1)}`;
                const input = document.getElementById(inputId);
                if (input) updateFaviconForInput(inputId, input.value);
            });
        }

        function getIframeUrlConfig() {
            const saved = localStorage.getItem(URL_STORAGE_KEY);
            if (!saved) return { ...state.defaultUrls };
            try {
                const parsed = JSON.parse(saved);
                return { ...state.defaultUrls, ...parsed };
            } catch (error) {
                return { ...state.defaultUrls };
            }
        }

        function normalizeUrl(url) {
            const trimmed = String(url || '').trim();
            if (!trimmed) return '';
            if (/^https?:\/\//i.test(trimmed)) return trimmed;
            return `https://${trimmed}`;
        }

        function syncBrowserBar(iframeId) {
            const activeIframe = document.getElementById(iframeId);
            const activeButton = document.querySelector(`.time-control[data-iframe-target="${iframeId}"]`);
            const address = document.getElementById('addressBar');
            const crumb = document.getElementById('breadcrumbProjectName');
            if (address && activeIframe) {
                address.value = activeIframe.getAttribute('src') || activeIframe.src || '';
            }
            if (crumb) {
                crumb.textContent = activeButton?.getAttribute('data-title') || iframeId;
            }
        }

        function applyIframeUrlConfig(urlConfig) {
            IFRAME_IDS.forEach(id => {
                const iframe = document.getElementById(id);
                if (!iframe) return;
                const nextSrc = (urlConfig[id] || '').trim();
                if (nextSrc && iframe.src !== nextSrc) {
                    iframe.src = nextSrc;
                }
            });
            refreshNavFavicons(urlConfig);
        }

        function saveIframeUrlConfig(urlConfig) {
            localStorage.setItem(URL_STORAGE_KEY, JSON.stringify(urlConfig));
        }

        function openUrlModal() {
            const modal = document.getElementById('urlModalOverlay');
            if (!modal) return;
            const currentConfig = getIframeUrlConfig();
            IFRAME_IDS.forEach(id => {
                const input = document.getElementById(`url${id.charAt(0).toUpperCase()}${id.slice(1)}`);
                if (input) input.value = currentConfig[id] || '';
            });
            refreshAllModalFavicons();
            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
            refreshLucide();
        }

        function closeUrlModal() {
            const modal = document.getElementById('urlModalOverlay');
            if (!modal) return;
            modal.classList.remove('open');
            modal.setAttribute('aria-hidden', 'true');
        }

        function setupUrlModal() {
            const openBtn = document.getElementById('openUrlModal');
            const closeBtn = document.getElementById('cancelUrlModal');
            const saveBtn = document.getElementById('saveUrlConfig');
            const loadGithubBtn = document.getElementById('loadGithubUrls');
            const modal = document.getElementById('urlModalOverlay');
            if (openBtn) openBtn.addEventListener('click', openUrlModal);
            if (closeBtn) closeBtn.addEventListener('click', closeUrlModal);
            if (modal) {
                modal.addEventListener('click', (event) => {
                    if (event.target === modal) closeUrlModal();
                });
            }
            if (saveBtn) {
                saveBtn.addEventListener('click', () => {
                    const nextConfig = {};
                    IFRAME_IDS.forEach(id => {
                        const input = document.getElementById(`url${id.charAt(0).toUpperCase()}${id.slice(1)}`);
                        if (input) {
                            nextConfig[id] = input.value.trim() || state.defaultUrls[id];
                        }
                    });
                    saveIframeUrlConfig(nextConfig);
                    applyIframeUrlConfig(nextConfig);
                    closeUrlModal();
                });
            }
            if (loadGithubBtn) {
                loadGithubBtn.addEventListener('click', async () => {
                    const githubInput = document.getElementById('githubConfigUrl');
                    if (!githubInput || !githubInput.value.trim()) {
                        alert('Podaj URL do raw JSON z GitHuba.');
                        return;
                    }
                    try {
                        const response = await fetch(githubInput.value.trim());
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const data = await response.json();
                        const mergedConfig = { ...state.defaultUrls, ...data };
                        saveIframeUrlConfig(mergedConfig);
                        applyIframeUrlConfig(mergedConfig);
                        IFRAME_IDS.forEach(id => {
                            const input = document.getElementById(`url${id.charAt(0).toUpperCase()}${id.slice(1)}`);
                            if (input) input.value = mergedConfig[id] || '';
                        });
                        refreshAllModalFavicons();
                    } catch (error) {
                        alert(`Nie udało się wczytać z GitHuba: ${error.message}`);
                    }
                });
            }
            IFRAME_IDS.forEach(id => {
                const inputId = `url${id.charAt(0).toUpperCase()}${id.slice(1)}`;
                const input = document.getElementById(inputId);
                if (!input) return;
                const sync = () => updateFaviconForInput(inputId, input.value);
                input.addEventListener('input', sync);
                input.addEventListener('blur', sync);
            });
        }

        function setupBrowserBar() {
            const address = document.getElementById('addressBar');
            const openBtn = document.getElementById('openAddressBtn');
            const saveBtn = document.getElementById('saveAddressBtn');
            if (!address) return;
            const openInActiveProject = () => {
                const normalized = normalizeUrl(address.value);
                if (!normalized || !state.activeIframe) return;
                const activeIframe = document.getElementById(state.activeIframe);
                if (activeIframe) activeIframe.src = normalized;
                address.value = normalized;
            };
            const saveActiveProjectUrl = () => {
                const normalized = normalizeUrl(address.value);
                if (!normalized || !state.activeIframe) return;
                const currentConfig = getIframeUrlConfig();
                currentConfig[state.activeIframe] = normalized;
                saveIframeUrlConfig(currentConfig);
                applyIframeUrlConfig(currentConfig);
            };
            address.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    openInActiveProject();
                }
            });
            if (openBtn) openBtn.addEventListener('click', openInActiveProject);
            if (saveBtn) saveBtn.addEventListener('click', saveActiveProjectUrl);
        }

        window.switchIframe = function (iframeId) {
            if (state.activeIframe === iframeId) return;
            const previousIframe = state.activeIframe ? document.getElementById(state.activeIframe) : null;
            const newIframe = document.getElementById(iframeId);
            if (!newIframe) return;
            if (previousIframe) previousIframe.style.opacity = '0';

            document.querySelectorAll('.time-control[data-iframe-target]').forEach(btn => {
                btn.classList.remove('pd-nav-btn--active');
            });

            const currentButton = document.querySelector(`[data-iframe-target="${iframeId}"]`);
            if (currentButton) {
                currentButton.classList.add('pd-nav-btn--active');
            }
            syncBrowserBar(iframeId);

            setTimeout(() => {
                document.querySelectorAll('.iframe-stage iframe').forEach(f => {
                    f.classList.remove('active');
                    f.style.display = 'none';
                });
                newIframe.style.display = 'block';
                newIframe.classList.add('active');
                state.activeIframe = iframeId;
                requestAnimationFrame(() => {
                    newIframe.style.opacity = '1';
                });
            }, previousIframe ? 100 : 0);
        };

        function setupRippleEffect() {
            document.querySelectorAll('.time-control').forEach(button => {
                button.addEventListener('click', function (e) {
                    const rect = button.getBoundingClientRect();
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple';
                    const size = Math.max(button.offsetWidth, button.offsetHeight) * 2;
                    ripple.style.width = ripple.style.height = `${size}px`;
                    ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
                    ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
                    const title = button.getAttribute('data-title');
                    const info = title ? state.colorMap[title] : null;
                    ripple.style.backgroundColor = info ? info.ripple : 'rgba(255,255,255,0.25)';
                    button.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 600);
                });
            });
        }

        function setupTooltips() {
            const tooltip = document.createElement('div');
            tooltip.className = 'custom-tooltip';
            Object.assign(tooltip.style, {
                position: 'absolute',
                backgroundColor: '#18181b',
                color: '#fafafa',
                padding: '6px 12px',
                zIndex: '1000',
                pointerEvents: 'none',
                opacity: '0',
                transition: 'opacity 0.2s ease',
                whiteSpace: 'nowrap',
                backdropFilter: 'blur(10px)',
                fontFamily: 'Inter, sans-serif'
            });
            document.body.appendChild(tooltip);
            document.querySelectorAll('[data-title]').forEach(button => {
                button.addEventListener('mouseenter', () => {
                    const title = button.getAttribute('data-title');
                    tooltip.textContent = title;
                    tooltip.style.opacity = '1';
                    tooltip.style.borderLeft = '3px solid #6366f1';
                    const rect = button.getBoundingClientRect();
                    tooltip.style.left = `${rect.right + 12}px`;
                    tooltip.style.top = `${rect.top + rect.height / 2 - tooltip.offsetHeight / 2}px`;
                });
                button.addEventListener('mouseleave', () => { tooltip.style.opacity = '0'; });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            refreshLucide();
            setupThemeToggle();
            setupUrlModal();
            setupBrowserBar();
            const initialConfig = getIframeUrlConfig();
            applyIframeUrlConfig(initialConfig);
            refreshNavFavicons(initialConfig);
            setupRippleEffect();
            setupTooltips();
            window.switchIframe('iframe1');
        });
    </script>
</body>
