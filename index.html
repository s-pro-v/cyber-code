<!DOCTYPE html>
<html lang="pl" theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Command Center | Code Editor</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.js"></script>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- Notification Overlay -->
    <div id="notification-container"></div>

    <!-- Modal System -->
    <div id="modal-container">
        <div class="modal">
            <div class="modal-header">
                <span id="modal-title">TITLE</span>
                <button class="btn-icon" style="background:none; border:none; color:inherit; cursor:pointer;"
                    onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Dynamic Content -->
            </div>
            <div class="modal-actions" id="modal-actions">
                <button id="modal-cancel-btn" class="btn">Cancel</button>
                <button id="modal-confirm-btn" class="btn btn-primary">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Settings Sidebar -->
    <div id="settings-sidebar-overlay" class="settings-sidebar-overlay" onclick="closeSettingsSidebar()"></div>
    <div id="settings-sidebar" class="settings-sidebar">
        <div class="settings-sidebar-header">
            <span class="settings-sidebar-title">EDITOR CONFIG</span>
            <button class="btn-icon" onclick="closeSettingsSidebar()"
                style="background:none; border:none; color:inherit; cursor:pointer;">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="settings-sidebar-body" id="settings-sidebar-body">
            <!-- Dynamic Content -->
        </div>
        <div class="settings-sidebar-footer">
            <div class="settings-footer-info">
                <div class="settings-footer-section">
                    <div class="settings-footer-item">
                        <i class="fas fa-code"></i>
                        <span>Monaco Editor v0.49.0</span>
                    </div>
                    <div class="settings-footer-item">
                        <i class="fas fa-terminal"></i>
                        <span>Cyber Code Editor</span>
                    </div>
                </div>
                <div class="settings-footer-divider"></div>
                <div class="settings-footer-section">
                    <div class="settings-footer-item">
                        <i class="fas fa-keyboard"></i>
                        <span>Ctrl+S - Save</span>
                    </div>
                    <div class="settings-footer-item">
                        <i class="fas fa-play"></i>
                        <span>Ctrl+Enter - Run</span>
                    </div>
                    <div class="settings-footer-item">
                        <i class="fas fa-moon"></i>
                        <span>Ctrl+T - Theme</span>
                    </div>
                    <div class="settings-footer-item">
                        <i class="fas fa-question-circle"></i>
                        <span>F1 - Shortcuts</span>
                    </div>
                </div>
                <div class="settings-footer-divider"></div>
                <div class="settings-footer-section">
                    <div class="settings-footer-item">
                        <i class="fas fa-save"></i>
                        <span>Auto-save enabled</span>
                    </div>
                    <div class="settings-footer-item">
                        <i class="fas fa-database"></i>
                        <span>Local storage active</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- App Main Structure -->
    <div class="app-container">

        <!-- Header HUD -->
        <header>
            <div class="logo">
                <i class="fas fa-terminal"></i>
                <span>Cyber<span style="color:var(--text-color)">Code</span></span>
            </div>

            <div class="control-deck">
                <button id="new-btn" class="btn" title="New Project (Ctrl+N)"><i class="fas fa-plus"></i></button>
                <button id="load-btn" class="btn" title="Open Project (Ctrl+O)"><i
                        class="fas fa-folder-open"></i></button>
                <button id="save-btn" class="btn btn-primary" title="Save Project (Ctrl+S)"><i class="fas fa-save"></i>
                    Save</button>
                <button id="download-btn" class="btn" title="Download HTML"><i class="fas fa-download"></i></button>
                <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 5px;"></div>
                <button id="settings-btn" class="btn" title="Settings"><i class="fas fa-cog"></i></button>
                <button id="shortcuts-btn" class="btn" title="Shortcuts (F1)"><i class="fas fa-keyboard"></i></button>
                <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 5px;"></div>
                <button id="view-editor-btn" class="btn btn-icon" title="Editor Only"><i
                        class="fas fa-code"></i></button>
                <button id="view-preview-btn" class="btn btn-icon" title="Preview Only"><i
                        class="fas fa-eye"></i></button>
                <button id="view-both-btn" class="btn btn-icon active" title="Both Views"><i
                        class="fas fa-columns"></i></button>
                <button id="theme-btn" class="btn" title="Toggle Theme (Ctrl+T)"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="content">
            <div class="data-grid" id="data-grid">

                <!-- Left Pane: Editor -->
                <div class="data-pane" id="editor-pane">
                    <div class="pane-header">
                        <div class="tab-group">
                            <div class="editor-tab active" data-tab="html"><i class="fab fa-html5"
                                    style="color: #e34c26;"></i> HTML</div>
                            <div class="editor-tab" data-tab="css"><i class="fab fa-css3-alt"
                                    style="color: #264de4;"></i> CSS</div>
                            <div class="editor-tab" data-tab="js"><i class="fab fa-js" style="color: #f0db4f;"></i> JS
                            </div>
                        </div>
                        <div class="pane-toolbar">
                            <button id="snippet-btn" class="btn btn-icon" title="Insert Snippet"><i
                                    class="fas fa-puzzle-piece"></i></button>
                            <button id="format-btn" class="btn btn-icon" title="Format Code"><i
                                    class="fas fa-align-left"></i></button>
                            <button id="clear-btn" class="btn btn-icon" title="Clear Code"><i
                                    class="fas fa-trash-alt"></i></button>
                            <button id="clean-all-btn" class="btn btn-icon btn-danger" title="Clean All Editors"><i
                                    class="fas fa-broom"></i></button>
                        </div>
                    </div>

                    <div class="editor-container">
                        <div id="html-editor" class="editor-content active"></div>
                        <div id="css-editor" class="editor-content"></div>
                        <div id="js-editor" class="editor-content"></div>
                    </div>
                </div>

                <!-- Right Pane: Preview -->
                <div class="data-pane" id="preview-pane">
                    <div class="pane-header">
                        <div class="pane-label">
                            <span><i class="fas fa-eye"></i> LIVE PREVIEW</span>
                        </div>
                        <div class="pane-toolbar">
                            <button id="run-btn" class="btn btn-primary btn-icon" title="Run Code (Enter)"><i
                                    class="fas fa-play"></i></button>
                            <button id="refresh-btn" class="btn btn-icon" title="Refresh Preview"><i
                                    class="fas fa-sync-alt"></i></button>
                            <button id="new-window-btn" class="btn btn-icon" title="Open in New Window"><i
                                    class="fas fa-external-link-alt"></i></button>
                        </div>
                    </div>
                    <div class="editor-container">
                        <iframe id="preview-iframe"></iframe>
                    </div>
                </div>

            </div>
        </div>

        <!-- Footer Status Bar -->
        <div class="app-footer">
            <div class="status-item">
                <div class="status-indicator"></div>
                <span id="editor-status">SYSTEM ONLINE</span>
            </div>
            <div class="status-item">
                <span id="file-status">Ready to code</span>
            </div>
        </div>

    </div>

    <!-- Application Logic -->
    <script src="index.js"></script>
    <script src="monaco-css.js"></script>
</body>

</html>
